  mongodb:
    image: mongo:7.0
    container_name: my-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    command: ["--bind_ip_all"]
    networks:
      iot-net:
        aliases:
          - mongodb
  
  app-frontend:
    build: ./frontend
    ports:
      - 3001:3000
    volumes:
      - ./frontend:/app
      - ./frontend/node_modules:/app/node_modules
    environment:
      REACT_APP_HOTELID: hotel_01
      REACT_APP_ROOMID: 101


volumes:
  victoria-metrics-data:
  grafana-data:
  mongodb-data:

networks:
  iot-net:
    external: true
  victoriametrics:
    driver: bridge
