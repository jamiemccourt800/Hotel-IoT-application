name: central-hq
version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      iot-net:
        aliases:
          - zookeeper

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server=kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - "9092:9092"
    networks:
      iot-net:
        aliases:
          - kafka

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.126.0
    command: --selfScrapeInterval=5s -storageDataPath=/victoria-metrics-data
    volumes:
      - ./victoria-metrics-data:/victoria-metrics-data
    ports:
      - "8428:8428"
    networks:
      - victoriametrics

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - kafka
      - victoria-metrics
      - zookeeper
    networks:
      - victoriametrics
      - iot-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      Grafana_admin_user: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/data:/var/lib/grafana
    depends_on:
      - victoria-metrics
    networks:
      - victoriametrics

  command:
    build: command
    container_name: command
    ports:
      - "5000:5000"
    environment:
      VICTORIA_METRICS_URL: http://victoria-metrics:8428
      API_PORT: 5000
      API_DEBUG: "false"
    depends_on:
      - victoria-metrics
    networks:
      - victoriametrics
      - iot-net

  ## BOOKING SYSTEM
  
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./main/static:/usr/share/nginx/html/static:ro
    depends_on:
      - hotels-frontend
      - users-frontend
      - bookings-frontend
      - hotels
      - users
      - bookings
  hotels:
    build: ./booking/backend/hotels
    ports:
      - "5001:5001"
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=root
      - MONGO_PASS=1Password!
      - MONGO_DB=bookings
    depends_on:
      - mongodb
  rooms:
    build: ./booking/backend/rooms
    ports:
      - "5004:5001" 
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=root
      - MONGO_PASS=1Password!
      - MONGO_DB=bookings
    depends_on:
      - mongodb
  users:
    build: ./booking/backend/users
    ports:
      - "5002:5002"
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=root
      - MONGO_PASS=1Password!
      - MONGO_DB=bookings
    depends_on:
      - mongodb
  bookings:
    build: ./booking/backend/bookings
    ports:
      - "5003:5003"
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=root
      - MONGO_PASS=1Password!
      - MONGO_DB=bookings
    depends_on:
      - mongodb
  hotels-frontend:
    build: ./booking/frontends/hotels-frontend
    ports:
      - "5100:5100"
    environment:
      - SECRET_KEY=devops_booking
      - HOTELS_API_URL=http://hotels:5001
      - ROOMS_API_URL=http://rooms:5001
      - USERS_API_URL=http://users:5002
      - BOOKINGS_API_URL=http://bookings:5003
    volumes:
      - ./frontends/hotels-frontend:/app
      - ./main/template:/app/templates_upstream:ro
      - ./main/static:/app/static_upstream:ro
    depends_on:
      - hotels
      - rooms
      - users
      - bookings
  users-frontend:
    build: ./booking/frontends/users-frontend
    ports:
      - "5200:5200"
    environment:
      - SECRET_KEY=devops_booking
      - USERS_API_URL=http://users:5002
    volumes:
      - ./frontends/users-frontend:/app
      - ./main/template:/app/templates_upstream:ro
      - ./main/static:/app/static_upstream:ro
    depends_on:
      - users
  bookings-frontend:
    build: ./booking/frontends/bookings-frontend
    ports:
      - "5300:5300"
    environment:
      - SECRET_KEY=devops_booking
      - BOOKINGS_API_URL=http://bookings:5003
    volumes:
      - ./frontends/bookings-frontend:/app
      - ./main/template:/app/templates_upstream:ro
      - ./main/static:/app/static_upstream:ro
    depends_on:
      - bookings
  
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./tempMongoDB:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 1Password!
      MONGO_INITDB_DATABASE: bookings


volumes:
  mongodb:
    external: true

networks:
  iot-net:
    external: true
  victoriametrics:
    driver: bridge
