<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up • Booking Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
  (function(){
    const API_SIGNUP = '/signup?ajax=1';
    const form = document.getElementById('signup-form');
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('submit-btn');
    const labelSpan = btn ? btn.querySelector('.btn-label') : null;
    function setStatus(msg, kind='error'){ if(!statusEl) return; statusEl.className = 'status show ' + kind; statusEl.textContent = msg; }
    function clearStatus(){ if(!statusEl) return; statusEl.className='status'; statusEl.textContent=''; }
    async function submitHandler(evt){ evt.preventDefault(); clearStatus(); if(!form){ setStatus('Form not found','error'); return; } const username = form.username.value.trim(); const password = form.password.value; const display_name = form.display_name.value.trim(); if(!username || !password){ setStatus('Username and password required','error'); return; } if(password.length < 6){ setStatus('Password too short','error'); return; } const payload = { username, password }; if(display_name) payload.display_name = display_name; if(btn){ btn.disabled = true; if(labelSpan) labelSpan.textContent = 'Creating...'; }
      try{
        const resp = await fetch(API_SIGNUP, { method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json','X-Requested-With':'XMLHttpRequest'}, body: JSON.stringify(payload), credentials:'same-origin' });
        const status = resp.status;
        let data = {};
        try{ data = await resp.json(); }catch(e){ setStatus('Unexpected response format','error'); return; }
        if(status === 201 && data.ok){ setStatus('Account created! Redirecting...', 'success'); setTimeout(()=> window.location.href='/', 900); }
        else{ setStatus(data.error || 'Signup failed', 'error'); }
      }catch(e){ setStatus('Error: ' + e, 'error'); }
      finally{ if(btn){ btn.disabled=false; if(labelSpan) labelSpan.textContent='Create Account'; } }
    }
    if(form){ form.addEventListener('submit', submitHandler); }
    try{ document.getElementById('year').textContent = new Date().getFullYear(); }catch(e){}
  })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <div class="orb"></div>
  <div class="orb orb2"></div>
  <div class="container">
    <div class="panel login-panel">
      <h1><span class="logo">Create</span> Account</h1>
      <p class="muted intro">Sign up to book hotels. You'll start as a guest.</p>
      <div id="status" class="status" aria-live="polite"></div>
  <form id="signup-form" action="/signup" method="post">
        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Zm0 2c-4.418 0-8 2.239-8 5v2h16v-2c0-2.761-3.582-5-8-5Z"/></svg>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Choose a username" required minlength="3" />
          </div>
        </div>
        <div class="field">
          <label for="display_name">Display Name (optional)</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Zm0 2c-4.418 0-8 2.239-8 5v2h16v-2c0-2.761-3.582-5-8-5Z"/></svg>
            <input id="display_name" name="display_name" type="text" placeholder="How others see you" />
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none"><path d="M17 9V7a5 5 0 1 0-10 0v2M6 9h12l1 12H5L6 9Zm6 4v4"/></svg>
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Minimum 6 characters" required minlength="6" />
          </div>
        </div>
        <button id="submit-btn" type="submit"><span class="btn-label">Create Account</span></button>
      </form>
      <div style="margin-top:1rem"></div>
      <a href="/login" style="font-size:.65rem; text-transform:uppercase; letter-spacing:.15em; font-weight:600; color:var(--text-dim); text-decoration:none;">Already have an account? Sign in</a>
    </div>
    <footer>© <span id="year"></span> Booking Platform • Sign Up</footer>
  </div>

  <!-- signup logic inlined above -->
</body>
</html>
