<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management • Booking Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.9.1/core.css" />
  <script type="module" src="https://pyscript.net/releases/2024.9.1/core.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% include 'spanel.html' %}
  <main style="padding:1.4rem clamp(1rem,4vw,3rem) 3rem; max-width:1100px; margin:0 auto;">
    <h1 style="margin:0 0 1.4rem; font-size:1.6rem;">User Management</h1>
    {% if user.role == 'guest' %}
      <div class="status-bar show error">Guests are not permitted to view user data.</div>
    {% else %}
    <section class="panel" style="padding:1.25rem 1.25rem 1.4rem; margin-bottom:1.6rem;">
      <h2 style="margin:0 0 1rem; font-size:1.1rem; letter-spacing:.5px;">Create User</h2>
      <form id="user-form" action="/api/users/create" method="post" novalidate style="display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); align-items:end;">
        <div style="display:flex; flex-direction:column; gap:.4rem;">
          <label for="username" class="muted" style="font-size:.7rem; text-transform:uppercase; letter-spacing:.12em; font-weight:600;">Username</label>
          <input id="username" name="username" type="text" required minlength="3" style="padding:.7rem .8rem; border-radius:10px; background:#1f2530; border:1px solid #2c3441; color:var(--text);" />
        </div>
        <div style="display:flex; flex-direction:column; gap:.4rem;">
          <label for="display" class="muted" style="font-size:.7rem; text-transform:uppercase; letter-spacing:.12em; font-weight:600;">Display Name</label>
          <input id="display" name="display_name" type="text" placeholder="(Optional)" style="padding:.7rem .8rem; border-radius:10px; background:#1f2530; border:1px solid #2c3441; color:var(--text);" />
        </div>
        <div style="display:flex; flex-direction:column; gap:.4rem;">
          <label for="password" class="muted" style="font-size:.7rem; text-transform:uppercase; letter-spacing:.12em; font-weight:600;">Password</label>
          <input id="password" name="password" type="password" required minlength="6" style="padding:.7rem .8rem; border-radius:10px; background:#1f2530; border:1px solid #2c3441; color:var(--text);" />
        </div>
        <div style="display:flex; flex-direction:column; gap:.4rem;">
          <label for="role" class="muted" style="font-size:.7rem; text-transform:uppercase; letter-spacing:.12em; font-weight:600;">Role</label>
          <select id="role" name="role" required style="padding:.7rem .8rem; border-radius:10px; background:#1f2530; border:1px solid #2c3441; color:var(--text);">
            {% for r in allowed_roles %}<option value="{{ r }}">{{ r|capitalize }}</option>{% endfor %}
          </select>
        </div>
        <div style="display:flex; gap:.6rem;">
          <button id="submit-btn" type="submit" style="background:linear-gradient(135deg,var(--accent), var(--accent-hover)); border:none; color:#fff; font-weight:600; padding:.75rem 1.1rem; border-radius:12px; cursor:pointer;"><span class="btn-label">Create</span></button>
        </div>
      </form>
      <div id="user-status" class="status-bar" style="margin-top:1rem;"></div>
    </section>
    <section class="panel" style="padding:1.25rem 1.25rem 1.4rem;">
      <h2 style="margin:0 0 1rem; font-size:1.1rem; letter-spacing:.5px;">Users</h2>
      <div class="table-wrapper" style="overflow-x:auto;">
        <table id="users-table" style="width:100%; border-collapse:collapse;">
          <thead>
            <tr style="text-align:left; font-size:.7rem; text-transform:uppercase; letter-spacing:.12em; color:var(--text-dim);">
              <th style="padding:.5rem .6rem;">Username</th>
              <th style="padding:.5rem .6rem;">Display Name</th>
              <th style="padding:.5rem .6rem;">Role</th>
              <th style="padding:.5rem .6rem;">Active</th>
              <th style="padding:.5rem .6rem;">Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody" style="font-size:.85rem;"></tbody>
        </table>
      </div>
    </section>
    {% endif %}
  </main>
  <footer style="padding:2rem 0 3rem; text-align:center; font-size:.7rem; color:var(--text-dim);">© <span id="year"></span> Booking Platform • Users</footer>

  <py-config>
    packages = []
  </py-config>
  <py-script src="{{ url_for('static', filename='py/users.py') }}?v=20251009a"></py-script>
  <script>
    // Minimal JS fallback: if PyScript doesn't bind, handle .u-btn actions here
    (function(){
      if (window._usersFallbackBound) return; window._usersFallbackBound = true;
      async function doFetch(url, opts){
        try { return await fetch(url, opts); } catch(e){ console.warn('[fallback] fetch error', e); return null; }
      }
      document.addEventListener('click', async function(e){
        const btn = e.target && e.target.closest && e.target.closest('button.u-btn');
        if (!btn) return;
        if (e.defaultPrevented) return; // PyScript handler already handled it
        e.preventDefault();
        const act = btn.dataset.act; const username = btn.dataset.user;
        if (!username) return;
        if (act === 'del'){
          const conf = window.prompt(`Delete user '${username}'? Type DELETE to confirm`);
          if (conf !== 'DELETE') return;
          let resp = await doFetch(`/api/users/${username}`, { method:'DELETE', headers:{'Accept':'application/json'} });
          if (resp && resp.status === 405){ // retry with GET override
            resp = await doFetch(`/api/users/${username}?_method=DELETE`, { method:'GET', headers:{'Accept':'application/json'} });
          }
          if (resp && resp.ok){ window.location.reload(); } else { alert('Delete failed'); }
          return;
        }
        if (act === 'tog'){
          // For fallback simplicity, not implemented. Use PyScript path.
          alert('Please use full page reload if toggle fails.');
          return;
        }
        if (act === 'edit' || act === 'pw'){
          alert('Please use full page reload if action fails.');
          return;
        }
      }, true);
    })();
  </script>
</body>
</html>
