<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Portal Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
  // Inline JS ported from static/py/login.py
  (function(){
    const API_LOGIN = '/login?ajax=1';
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('submit-btn');
    const labelSpan = btn ? btn.querySelector('.btn-label') : null;

    function setStatus(message, kind){ if(!statusEl) return; statusEl.className = 'status show ' + kind; statusEl.innerHTML = message; }
    function clearStatus(){ if(!statusEl) return; statusEl.className='status'; statusEl.innerHTML=''; }

    async function handleSubmit(evt){
      evt.preventDefault(); clearStatus();
      const form = document.getElementById('login-form'); if(!form){ setStatus('Form not found', 'error'); return; }
      const username = (form.username.value||'').trim(); const password = form.password.value||'';
      if(username.length < 3){ setStatus('Username must be at least 3 characters', 'error'); return; }
      if(password.length < 6){ setStatus('Password must be at least 6 characters', 'error'); return; }
      if(btn){ btn.disabled = true; if(labelSpan) labelSpan.innerHTML = 'Signing in...'; }
      try{
        const resp = await fetch(API_LOGIN, { method:'POST', headers:{ 'Content-Type':'application/json', 'Accept':'application/json','X-Requested-With':'XMLHttpRequest' }, body: JSON.stringify({username, password}), redirect:'manual', credentials:'same-origin' });
        if(resp.status === 302){ window.location.href = '/'; return; }
        if(resp.status === 401){ setStatus('Invalid username or password', 'error'); return; }
        if(resp.status !== 200){ setStatus(`Server error: ${resp.status}`, 'error'); return; }
        const ctype = resp.headers && resp.headers.get ? resp.headers.get('Content-Type') : '';
        if(!ctype || ctype.toLowerCase().indexOf('application/json') === -1){
          const preview = await resp.text().catch(()=> '');
          const snip = preview.length>160? preview.slice(0,160)+'…': preview;
          setStatus(`Unexpected non-JSON response (status ${resp.status}). Preview: ${snip}`, 'error');
          return;
        }
        const data = await resp.json();
        const result = data || {};
        if(result.ok){ setStatus('Login successful! Redirecting...', 'success'); await new Promise(r=>setTimeout(r,500)); window.location.href = '/'; }
        else{ setStatus(result.error || 'Login failed', 'error'); }
      }catch(e){ setStatus('Error: ' + e, 'error'); }
      finally{ if(btn){ btn.disabled = false; if(labelSpan) labelSpan.innerHTML = 'Sign In'; } }
    }

    // Attach on DOM load
    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', ()=>{ const form = document.getElementById('login-form'); if(form) form.addEventListener('submit', handleSubmit); });
    } else {
      const form = document.getElementById('login-form'); if(form) form.addEventListener('submit', handleSubmit);
    }
    try{ document.getElementById('year').innerHTML = new Date().getFullYear(); }catch(e){}
  })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <div class="orb"></div>
  <div class="orb orb2"></div>
  <div class="container">
  <div class="panel login-panel">
      <h1><span class="logo">Booking</span> Portal</h1>
  <p class="muted intro">Sign in to access the central booking dashboard.</p>

      <div id="status" class="status" aria-live="polite"></div>

  <form id="login-form" action="/login" method="post">
        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Zm0 2c-4.418 0-8 2.239-8 5v2h16v-2c0-2.761-3.582-5-8-5Z"/></svg>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Your username" required minlength="3" />
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none"><path d="M17 9V7a5 5 0 1 0-10 0v2M6 9h12l1 12H5L6 9Zm6 4v4"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="6" />
          </div>
        </div>
        <button id="submit-btn" type="submit">
          <span class="btn-label">Sign In</span>
        </button>
      </form>

      <div style="margin-top: 1rem;"></div>

      <a href="/signup" style="font-size:.65rem; text-transform:uppercase; letter-spacing:.15em; font-weight:600; color:var(--text-dim); text-decoration:none;">Looking to book? Sign Up Here!</a>
      <div style="margin-top:1rem" class="muted">Use <code>admin</code> / <code>password123</code> for demo access.</div>
    </div>
    <footer>© <span id="year"></span> Booking Platform • DevOps Group 3</footer>
  </div>

  <py-config>
  packages = []
  </py-config>
  <py-script src="{{ url_for('static', filename='py/login.py') }}"></py-script>
</body>
</html>
