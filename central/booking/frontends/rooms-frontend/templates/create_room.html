<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Room • Booking Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.9.1/core.css" />
  <script type="module" src="https://pyscript.net/releases/2024.9.1/core.js"></script>
</head>
<body>
  {% include 'spanel.html' %}
  <main style="max-width:820px; margin:0 auto; padding:1.5rem clamp(1rem,4vw,3rem) 3rem;">
    <h1 style="margin:0 0 1.2rem; font-size:1.4rem; letter-spacing:-.5px; display:flex; align-items:center; gap:.65rem;">Create Room</h1>
    <div id="status" class="status" aria-live="polite"></div>
    <div class="panel" style="padding:1.4rem 1.5rem 2rem;">
      <form id="create-form" class="styled-form">
        <div class="field">
          <label for="hotel_id">Hotel ID</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none"><path d="M3 5h9l-1 4 4-2h6v12h-6l-4 2 1-4H3V5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input id="hotel_id" name="hotel_id" required placeholder="Hotel ObjectId" />
          </div>
        </div>
        <div class="field">
          <label for="room_number">Room Number</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v13H4z" stroke="currentColor" stroke-width="1.5"/><path d="M9 21v-4m6 4v-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input id="room_number" name="room_number" required placeholder="e.g. 101" />
          </div>
        </div>
        <div class="field">
          <label for="type">Type</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v18m5-15H9.5a3.5 3.5 0 0 0 0 7H14a3.5 3.5 0 0 1 0 7H6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input id="type" name="type" placeholder="single/double/suite" />
          </div>
        </div>
        <div class="field">
          <label for="capacity">Capacity</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5Z" stroke="currentColor" stroke-width="1.2"/></svg>
            <input id="capacity" name="capacity" type="number" min="0" />
          </div>
        </div>
        <div class="field">
          <label for="price_per_night">Price per Night</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v18m5-15H9.5a3.5 3.5 0 0 0 0 7H14a3.5 3.5 0 0 1 0 7H6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input id="price_per_night" name="price_per_night" type="number" step="0.01" min="0" placeholder="e.g. 79.99" />
          </div>
        </div>
        <div style="display:flex; gap:.8rem; align-items:center; flex-wrap:wrap; margin-top:.4rem;">
          <button class="primary" style="height:46px;" id="submit-btn" type="submit">Create Room</button>
          <a href="/manage-rooms" class="btn-secondary" style="text-decoration:none; height:46px; display:inline-flex; align-items:center;">← Back</a>
        </div>
      </form>
    </div>
  </main>
  <footer style="padding:2rem 0 3rem; text-align:center; font-size:.7rem; color:var(--text-dim);">© <span id="year"></span> Booking Platform • Create Room</footer>

  <py-config>
    packages = []
  </py-config>

  <script>
    const statusEl = document.getElementById('status');
    function setStatus(msg, kind='error'){ if(statusEl){ statusEl.className = `status show ${kind}`; statusEl.textContent = msg; } }
    function clearStatus(){ if(statusEl){ statusEl.className = 'status'; statusEl.textContent = ''; } }
    document.getElementById('create-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearStatus();
      const fd = new FormData(e.target);
      const payload = Object.fromEntries(fd.entries());
      ['capacity','price_per_night'].forEach(k => { if (payload[k] === '') delete payload[k]; });
      try{
        const res = await fetch('/api/rooms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)});
        const data = await res.json();
        if(!res.ok || !data.ok){ setStatus(data.error || 'Failed to create room'); return; }
        setStatus('Room created','success');
        window.location.href = '/manage-rooms';
      }catch(err){ setStatus(String(err)); }
    });
  </script>
</body>
</html>
