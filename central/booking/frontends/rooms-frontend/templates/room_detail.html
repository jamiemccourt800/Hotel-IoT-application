<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Room Detail</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <h1>Room Detail</h1>
  <section id="info"></section>
  <section>
    <h2>Book this room</h2>
    <form id="bookForm">
      <label>Hotel ID <input name="hotel_id" required /></label><br/>
      <label>Check-in <input name="check_in" type="date" required /></label><br/>
      <label>Check-out <input name="check_out" type="date" required /></label><br/>
      <label>Guests <input name="guests" type="number" min="1" value="1" required /></label><br/>
      <button type="submit">Request Booking</button>
    </form>
  </section>
  <pre id="out"></pre>
  <script>
    const roomId = window.location.pathname.split('/').pop();
    async function load() {
      const res = await fetch(`/api/rooms/${roomId}`);
      const data = await res.json();
      if (!data.ok) { document.getElementById('info').textContent = JSON.stringify(data, null, 2); return; }
      const r = data.room;
      document.querySelector('#info').innerHTML = `<p><b>Room:</b> ${r.room_number || ''}</p>
        <p><b>Type:</b> ${r.type || ''}</p>
        <p><b>Capacity:</b> ${r.capacity ?? ''}</p>
        <p><b>Price:</b> ${r.price_per_night ?? ''}</p>
        <p><b>Hotel ID:</b> ${r.hotel_id || ''}</p>`;
      document.querySelector('#bookForm [name=hotel_id]').value = r.hotel_id || '';
    }
    document.getElementById('bookForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const payload = Object.fromEntries(fd.entries());
      const res = await fetch('/api/bookings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)});
      const data = await res.json();
      document.getElementById('out').textContent = JSON.stringify(data, null, 2);
      if (res.ok && data && data.ok) {
        // Redirect to Manage Bookings so the user can review/approve
        setTimeout(() => { window.location.href = '/manage-bookings'; }, 900);
      }
    });
    load();
  </script>
</body>
</html>
