<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Bookings • Booking Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script>
  (function(){
    // Port of static/py/manage_bookings.py
    const API_LIST = '/api/admin/bookings';
    const API_STATUS = '/api/admin/bookings';
    const API_DELETE = '/api/admin/bookings';
    const statusEl = document.getElementById('mb-status');
    const listEl = document.getElementById('mb-list');
    const selStatus = document.getElementById('filter-status');
    const inputHotel = document.getElementById('filter-hotel');
    const inputUser = document.getElementById('filter-user');
    const btnRefresh = document.getElementById('btn-refresh');

    function setStatus(msg, kind='error'){ if(statusEl){ statusEl.className='status show '+kind; statusEl.textContent=msg; } }
    function clearStatus(){ if(statusEl){ statusEl.className='status'; statusEl.textContent=''; } }

    async function loadBookings(){ clearStatus(); try{ const params = []; if(selStatus && selStatus.value) params.push(`status=${encodeURIComponent(selStatus.value)}`); if(inputHotel && inputHotel.value) params.push(`hotel_id=${encodeURIComponent(inputHotel.value)}`); if(inputUser && inputUser.value) params.push(`user=${encodeURIComponent(inputUser.value)}`); const qs = params.length?('?'+params.join('&')):''; const r = await fetch(API_LIST + qs); if(!r.ok){ setStatus(`Failed to load bookings (${r.status})`,'error'); return; } const j = await r.json(); if(!j.ok){ setStatus(j.error || 'Load failed','error'); return; } const bookings = j.bookings || []; listEl.innerHTML=''; for(const b of bookings){ listEl.appendChild(renderBooking(b)); } setStatus(`Loaded ${bookings.length} booking(s)`, 'success'); }catch(e){ setStatus('Error: '+e,'error'); } }

    async function updateStatus(evt, bookingId, newStatus, row){ evt.preventDefault(); const btn = evt.currentTarget; if(btn) btn.disabled=true; try{ const r = await fetch(`${API_STATUS}/${bookingId}/status`, { method:'PATCH', headers: {'Content-Type':'application/json','Accept':'application/json'}, body: JSON.stringify({status:newStatus}) }); if(!r.ok){ setStatus(`Update failed (${r.status})`,'error'); if(btn) btn.disabled=false; return; } const j = await r.json(); if(!j.ok){ setStatus(j.error || 'Update failed','error'); if(btn) btn.disabled=false; return; } const b = j.booking || {}; const newRow = renderBooking(b); row.replaceWith(newRow); setStatus('Status updated','success'); }catch(e){ setStatus('Error: '+e,'error'); if(btn) btn.disabled=false; } }

    async function adminDelete(evt, bookingId, row){ evt.preventDefault(); if(!confirm('Permanently delete this booking? This cannot be undone.')) return; const btn = evt.currentTarget; if(btn) { btn.disabled=true; btn.textContent='Deleting…'; } try{ let r = await fetch(`${API_DELETE}/${bookingId}`, { method:'DELETE', headers:{'Accept':'application/json'} }); if(!r.ok){ let msg = null; try{ const j = await r.json(); msg = j.error || j.message; }catch(e){} setStatus(`Delete failed${msg?': '+msg:''} (${r.status})`, 'error'); if(btn){ btn.disabled=false; btn.textContent='Delete'; } return; } const j = await r.json(); if(!j.ok){ setStatus(j.error || 'Delete failed','error'); if(btn){ btn.disabled=false; btn.textContent='Delete'; } return; } row.remove(); setStatus('Booking deleted','success'); }catch(e){ setStatus('Error: '+e,'error'); if(btn){ btn.disabled=false; btn.textContent='Delete'; } }
    }

    function renderBooking(b){ const row = document.createElement('div'); row.className='booking-item'; const st = b.status || ''; const rn = b.room_number || ''; const rt = b.room_type || ''; const roomParts = []; if(rn) roomParts.push(`Room ${rn}`); if(rt) roomParts.push(rt); const roomTxt = roomParts.join(' • '); const total = b.total_cost; const totalFmt = (typeof total==='number')? total.toFixed(2) : (total||''); row.innerHTML = `
      <div class="bk-head">
        <div class="bk-hotel"><a href="/hotel/${b.hotel_id||''}" class="bk-hotel-name">${b.hotel_name||'Hotel'}</a>
          <div class="bk-dates">${b.check_in||''} → ${b.check_out||''} <span class="nights">(${b.nights||'?'} nights)</span></div>
        </div>
        <div class="bk-meta">
          <span class="bk-status ${st}">${st? (st.charAt(0).toUpperCase()+st.slice(1)) : ''}</span>
          <span class="bk-total">$${totalFmt}</span>
        </div>
      </div>
      <div class="bk-foot">
        <div class="bk-guests">Guests: ${b.guests}</div>
        ${ roomTxt ? `<div class="bk-room">${roomTxt}</div>` : '' }
        <div class="bk-actions">${ (st==='cancelled'||st==='denied')? '<span class="bk-cancelled-note">—</span>' : `<button type="button" class="mb-approve" data-id="${b._id||''}">Approve</button><button type="button" class="mb-deny" data-id="${b._id||''}">Deny</button>` }<button type="button" class="mb-delete" data-id="${b._id||''}">Delete</button></div>
      </div>
    `; if(st!=='cancelled' && st!=='denied'){ const approve = row.querySelector('.mb-approve'); const deny = row.querySelector('.mb-deny'); if(approve) approve.addEventListener('click', (evt)=> updateStatus(evt, approve.getAttribute('data-id'), 'confirmed', row)); if(deny) deny.addEventListener('click', (evt)=> updateStatus(evt, deny.getAttribute('data-id'), 'denied', row)); } const delBtn = row.querySelector('.mb-delete'); if(delBtn) delBtn.addEventListener('click', (evt)=> adminDelete(evt, delBtn.getAttribute('data-id'), row)); return row; }

    if(btnRefresh) btnRefresh.addEventListener('click', ()=> loadBookings());
    loadBookings(); try{ document.getElementById('year').textContent = new Date().getFullYear(); }catch(e){}
  })();
  </script>
</head>
<body>
  {% include 'spanel.html' %}
  <main style="max-width:1100px; margin:0 auto; padding:1.5rem clamp(1rem,4vw,3rem) 3rem;">
    <h1 style="margin:0 0 1rem; font-size:1.45rem; letter-spacing:-.5px; display:flex; align-items:center; gap:.65rem;">Manage Bookings</h1>
    <div id="mb-status" class="status" aria-live="polite"></div>
    <div class="panel" style="padding:1.25rem 1.4rem 1.8rem;">
      <div style="display:flex; gap:.6rem; align-items:center; margin-bottom:.75rem; flex-wrap:wrap;">
        <label>Status:
          <select id="filter-status">
            <option value="">All</option>
            <option value="pending" selected>Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="denied">Denied</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </label>
        <label>Hotel ID: <input id="filter-hotel" type="text" placeholder="(optional)" /></label>
        <label>User: <input id="filter-user" type="text" placeholder="(optional)" /></label>
        <button id="btn-refresh" class="primary" type="button">Refresh</button>
      </div>
      <div id="mb-list" class="bookings-list"></div>
    </div>
  </main>
  <footer style="text-align:center; padding:2rem 0 3rem; font-size:.7rem; color:var(--text-dim);">© <span id="year"></span> Booking Platform • Manage Bookings</footer>
  <py-script src="{{ url_for('static', filename='py/manage_bookings.py') }}"></py-script>
</body>
</html>
