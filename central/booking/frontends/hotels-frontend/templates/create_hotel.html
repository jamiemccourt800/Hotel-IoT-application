<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Hotel • Booking Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <!-- Client-side JS (replaces PyScript) -->
 </head>
<body>
    {% include 'spanel.html' %}
    <main style="max-width:720px; margin:0 auto; padding:1.4rem clamp(1rem,4vw,3rem) 3rem;">
        <div class="panel login-panel" style="margin-top:1rem;">
            <h1 style="margin-top:0;"><span class="logo">Create</span> Hotel</h1>
            <p class="muted intro">Add a new hotel listing to the catalog.</p>
            <div id="status" class="status" aria-live="polite"></div>

            <form id="create-hotel-form" class="styled-form" action="/api/hotels/create" method="post">
                <div class="field">
                    <label for="name">Hotel Name</label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Zm0 2c-4.418 0-8 2.239-8 5v2h16v-2c0-2.761-3.582-5-8-5Z"/></svg>
                        <input type="text" id="name" name="name" placeholder="e.g. Hilton Midtown" required minlength="2" />
                    </div>
                </div>

                <div class="field">
                    <label for="city">City</label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Zm0 2c-4.418 0-8 2.239-8 5v2h16v-2c0-2.761-3.582-5-8-5Z"/></svg>
                        <input type="text" id="city" name="city" placeholder="e.g. Dublin" required minlength="2" />
                    </div>
                </div>

                <div class="field">
                    <label for="country">Country</label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Zm0 2c-4.418 0-8 2.239-8 5v2h16v-2c0-2.761-3.582-5-8-5Z"/></svg>
                        <input type="text" id="country" name="country" placeholder="e.g. Ireland" required minlength="2" />
                    </div>
                </div>

                <div class="field">
                    <label for="price_per_night">Price per Night</label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Zm0 2c-4.418 0-8 2.239-8 5v2h16v-2c0-2.761-3.582-5-8-5Z"/></svg>
                        <input type="number" id="price_per_night" name="price_per_night" placeholder="e.g. 129.99" min="0" step="0.01" required />
                    </div>
                </div>

                <div class="field">
                    <label for="image">Image URL</label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Zm0 2c-4.418 0-8 2.239-8 5v2h16v-2c0-2.761-3.582-5-8-5Z"/></svg>
                        <input type="url" id="image" name="image" placeholder="https://example.com/hotel.jpg" required />
                    </div>
                </div>

                <div class="field">
                    <label for="room_count">Room Count</label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Zm0 2c-4.418 0-8 2.239-8 5v2h16v-2c0-2.761-3.582-5-8-5Z"/></svg>
                        <input type="number" id="room_count" name="room_count" min="0" step="1" placeholder="e.g. 120" />
                    </div>
                </div>

                <details class="muted" style="font-size:.75rem;">
                    <summary style="cursor:pointer; font-weight:600;">Advanced (Managers)</summary>
                    <div class="field" style="margin-top:.5rem;">
                        <label for="manager-picker">Add Manager</label>
                        <div class="input-wrap">
                            <svg viewBox="0 0 24 24" fill="none"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Zm0 2c-4.418 0-8 2.239-8 5v2h16v-2c0-2.761-3.582-5-8-5Z"/></svg>
                            <select id="manager-picker" aria-label="Select manager">
                                <option value="" selected disabled>Loading eligible users...</option>
                            </select>
                        </div>
                        <div style="display:flex; gap:.6rem; align-items:center; margin-top:.6rem;">
                            <button type="button" id="add-manager-btn" class="btn-secondary">Add</button>
                            <span class="muted" style="font-size:.7rem;">Pick users with manager/admin role.</span>
                        </div>
                        <div id="managers-chips" style="display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.6rem;"></div>
                        <input type="hidden" id="managers" name="managers" />
                        <p class="muted" style="margin:.4rem 0 0;">You are automatically added. Only users with manager/admin role will be applied.</p>
                    </div>
                </details>

                <button id="submit-btn" type="submit"><span class="btn-label">Create Hotel</span></button>
            </form>
            <div style="margin-top:1rem"></div>
            <a href="/" style="font-size:.65rem; text-transform:uppercase; letter-spacing:.15em; font-weight:600; color:var(--text-dim); text-decoration:none;">Back to listings</a>
        </div>
    </main>
    <footer style="padding:2rem 0 3rem; text-align:center; font-size:.7rem; color:var(--text-dim);">© <span id="year"></span> Booking Platform • Create Hotel</footer>

    <!-- Inline JS ported from create_hotel.py -->
    <script>
    (function(){
        const API_CREATE = '/api/hotels/create';
        const API_USERS = '/api/users';
        const form = document.getElementById('create-hotel-form');
        const statusEl = document.getElementById('status');
        const btn = document.getElementById('submit-btn');
        const picker = document.getElementById('manager-picker');
        const addBtn = document.getElementById('add-manager-btn');
        const chipsEl = document.getElementById('managers-chips');
        const hiddenManagers = document.getElementById('managers');

        function setStatus(msg, kind='error'){
            if(!statusEl) return;
            statusEl.className = 'status show ' + kind;
            statusEl.textContent = msg;
        }
        function clearStatus(){ if(statusEl){ statusEl.className='status'; statusEl.textContent=''; } }

        function serialize(){
            if(!form) return {};
            const payload = {
                name: form.name.value.trim(),
                city: form.city.value.trim(),
                country: form.country.value.trim(),
                price_per_night: form.price_per_night.value.trim(),
                image: form.image.value.trim(),
            };
            if(form.room_count && form.room_count.value.trim() !== '') payload.room_count = form.room_count.value.trim();
            if(hiddenManagers && hiddenManagers.value.trim()){
                payload.managers = hiddenManagers.value.split(',').map(s=>s.trim()).filter(Boolean);
            }
            return payload;
        }

        async function submitHandler(evt){
            evt.preventDefault();
            clearStatus();
            const payload = serialize();
            // basic required check
            if(!payload.name || !payload.city || !payload.country || !payload.price_per_night || !payload.image){
                setStatus('All fields are required.', 'error');
                return;
            }
            if(btn){ btn.disabled = true; btn.classList.add('loading'); }
            try{
                const resp = await fetch(API_CREATE, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
                const text = await resp.text();
                let data = {};
                try{ data = JSON.parse(text); }catch(e){ setStatus('Unexpected response format', 'error'); return; }
                if((resp.status>=200 && resp.status<300 && data.ok) || data.hotel_id){
                    setStatus(data.message || 'Hotel created! Redirecting...', 'success');
                    setTimeout(()=> window.location.href='/', 1100);
                } else {
                    setStatus(data.error || 'Failed to create hotel', 'error');
                }
            }catch(e){ setStatus('Network or server error: ' + e, 'error'); }
            finally{ if(btn){ btn.disabled = false; btn.classList.remove('loading'); } }
        }

        // Manager picker logic
        let selectedMgrs = new Set();
        function renderChips(){
            if(!chipsEl) return;
            chipsEl.innerHTML = '';
            const arr = Array.from(selectedMgrs).sort();
            for(const uname of arr){
                const span = document.createElement('span');
                span.className = 'user-badge';
                span.style.display = 'inline-flex';
                span.style.alignItems = 'center';
                span.style.gap = '.35rem';
                span.textContent = uname;
                const rm = document.createElement('button');
                rm.textContent = '\u00d7';
                rm.setAttribute('aria-label', `Remove ${uname}`);
                rm.style.background='transparent'; rm.style.border='none'; rm.style.cursor='pointer'; rm.style.color='var(--text-dim)';
                rm.addEventListener('click', ()=>{ selectedMgrs.delete(uname); renderChips(); });
                span.appendChild(rm);
                chipsEl.appendChild(span);
            }
            if(hiddenManagers){ hiddenManagers.value = arr.join(','); }
        }

        async function loadUsers(){
            if(!picker) return;
            try{
                const resp = await fetch(API_USERS, { headers: { 'Accept': 'application/json' } });
                const text = await resp.text();
                const data = JSON.parse(text || '{}');
                const options = [];
                if(data.ok && Array.isArray(data.users)){
                    for(const u of data.users){
                        const role = (u.role||'').toLowerCase();
                        if(role==='admin' || role==='manager') options.push({username: u.username, display_name: u.display_name||u.username});
                    }
                }
                picker.innerHTML = '';
                const ph = document.createElement('option'); ph.value=''; ph.textContent='Select a manager to add'; ph.disabled=true; ph.selected=true; picker.appendChild(ph);
                for(const opt of options){ const el = document.createElement('option'); el.value = opt.username; el.textContent = `${opt.display_name} (${opt.username})`; picker.appendChild(el); }
            }catch(e){ picker.innerHTML=''; const err = document.createElement('option'); err.value=''; err.textContent='Failed to load users'; err.disabled=true; err.selected=true; picker.appendChild(err); }
        }

        function addSelectedMgr(){ if(!picker) return; const u = (picker.value||'').trim(); if(!u) return; if(selectedMgrs.has(u)) return; selectedMgrs.add(u); renderChips(); picker.value=''; }

        if(form){ form.addEventListener('submit', submitHandler); }
        if(addBtn){ addBtn.addEventListener('click', addSelectedMgr); }
        if(picker){ picker.addEventListener('change', addSelectedMgr); }
        loadUsers();
        renderChips();

        // autofill from query params (like PyScript version did)
        try{
            const params = new URLSearchParams(window.location.search);
            ['name','city','country','price_per_night','image','room_count'].forEach(k => { if(params.has(k) && form && form[k]) form[k].value = params.get(k); });
        }catch(e){ /* ignore */ }
        try{ document.getElementById('year').textContent = new Date().getFullYear(); }catch(e){}
    })();
    </script>
</body>
</html>
