<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Hotels • Booking Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script>
  (function(){
    // Port of static/py/manage_hotels.py
    const API_LIST = '/api/hotels?managed=1';
    const API_AV = '/api/availability';
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('managed-hotels');
    const loadingEl = document.getElementById('loading');
    const emptyEl = document.getElementById('empty');
    function setStatus(msg, kind='error'){ if(statusEl){ statusEl.className='status show '+kind; statusEl.textContent=msg; } }
    function clearStatus(){ if(statusEl){ statusEl.className='status'; statusEl.textContent=''; } }
    function _dateIso(d){ try{ return d.toISOString().slice(0,10); }catch(e){ return ''; } }
    function _defaultRange(){ const today = new Date(); const end = new Date(); end.setDate(today.getDate()+7); return [today, end]; }
    async function loadHotels(){ try{ const r = await fetch(API_LIST); if(!r.ok){ setStatus(`Failed to load hotels (${r.status})`,'error'); return; } const data = await r.json(); if(!data.ok){ setStatus(data.error || 'Load failed','error'); return; } const hotels = data.hotels || []; if(loadingEl) loadingEl.remove(); if(!hotels.length){ if(emptyEl) emptyEl.hidden = false; return; } if(listEl){ listEl.innerHTML=''; listEl.hidden=false; const avs = document.getElementById('av-start'); const ave = document.getElementById('av-end'); let start, end; if(avs && ave){ if(!avs.value || !ave.value){ const [t,e] = _defaultRange(); if(avs && !avs.value) avs.value = _dateIso(t); if(ave && !ave.value) ave.value = _dateIso(e); } start = avs.value; end = ave.value; } else { const [t,e] = _defaultRange(); start = _dateIso(t); end = _dateIso(e); } for(const h of hotels){ const card = await renderHotel(h, start, end); listEl.appendChild(card); } } }catch(e){ setStatus('Error: '+e,'error'); } }
    async function renderHotel(h, start, end){ const card = document.createElement('div'); card.className='hotel-card'; const hid = h.hotel_id || ''; const hiddenFlag = h.hidden === true; const img_url = h.image || ''; const rc = h.room_count || 0; let caps = `<div class="meta caps" style="margin-top:.4rem; display:flex; gap:.6rem; flex-wrap:wrap;"><span class="tag">Rooms: <strong>${rc}</strong></span><span class="tag" id="b-${hid}">Booked: …</span><span class="tag" id="a-${hid}">Available: …</span></div>`; card.innerHTML = `<picture><img src="${img_url}" alt="${h.name||''}" loading="lazy" /></picture><div class="hotel-body"><div class="hotel-name">${h.name||''} <span class="price">$${h.price_per_night||0}</span></div><div class="meta">${h.city||''} • ${h.country||''}</div>${caps}<div style="display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.4rem;"><a class="u-btn" href="/hotel/${hid}">View</a><a class="u-btn" href="/edit-hotel/${hid}">Edit</a><a class="u-btn" href="/edit-hotel/${hid}#rooms">Manage Rooms</a><button class="u-btn" data-action="toggle" data-id="${hid}" style="background:${hiddenFlag? 'rgba(239,68,68,.12)':'#2b333e'};">${hiddenFlag? 'Unhide':'Hide'}</button></div>${ hiddenFlag? '<div class="meta" style="margin-top:.5rem;color:#fca5a5;">Hidden</div>':'' }</div>`; const btns = card.getElementsByTagName('button'); for(let i=0;i<btns.length;i++){ const b = btns.item(i); if(b.getAttribute('data-action')==='toggle'){ b.addEventListener('click', (evt)=> toggleVisibility(evt, hid, b, card)); } }
      try{ const params = `?hotel_id=${encodeURIComponent(hid)}&start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`; const r = await fetch(API_AV + params); if(r.ok){ const data = await r.json(); if(data.ok){ const booked = data.max_booked || 0; const avail = data.min_available !== undefined ? data.min_available : (h.room_count||0); const bEl = card.querySelector(`#b-${hid}`); const aEl = card.querySelector(`#a-${hid}`); if(bEl) bEl.textContent = `Booked: ${booked}`; if(aEl) aEl.textContent = `Available: ${avail}`; } } }catch(e){}
      return card; }
    async function toggleVisibility(evt, hotelId, btn, card){ evt.preventDefault(); if(!hotelId) return; try{ btn.disabled = true; btn.textContent = '...'; const r = await fetch(`/api/hotels/${hotelId}/visibility`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({}) }); if(!r.ok){ btn.disabled=false; btn.textContent='Retry'; setStatus(`Visibility update failed (${r.status})`,'error'); return; } const data = await r.json(); if(!data.ok){ setStatus(data.error || 'Failed','error'); btn.disabled=false; btn.textContent='Retry'; return; } const hidden = data.hidden; if(hidden){ btn.textContent = 'Unhide'; btn.style.background='rgba(239,68,68,.12)'; btn.style.borderColor='rgba(239,68,68,.4)'; btn.style.color='#fca5a5'; if(!card.querySelector('.hidden-badge')){ const hb = document.createElement('div'); hb.className='meta hidden-badge'; hb.style.marginTop='.5rem'; hb.style.color='#fca5a5'; hb.textContent='Hidden'; card.querySelector('.hotel-body').appendChild(hb); } } else { btn.textContent='Hide'; btn.style.background='#2b333e'; btn.style.borderColor='#303a46'; btn.style.color='#e5e7eb'; const badge = card.querySelector('.hidden-badge'); if(badge) badge.remove(); } setStatus('Visibility updated','success'); btn.disabled=false; }catch(e){ setStatus('Error: '+e,'error'); try{ btn.disabled=false; }catch(_){} } }
    loadHotels(); try{ document.getElementById('year').textContent = new Date().getFullYear(); }catch(e){}
    // refresh and date inputs
    const refreshBtn = document.getElementById('btn-refresh'); if(refreshBtn) refreshBtn.addEventListener('click', ()=> loadHotels()); try{ const avs = document.getElementById('av-start'); const ave = document.getElementById('av-end'); if(avs && ave){ const today = new Date(); avs.min = today.toISOString().slice(0,10); function syncDates(){ try{ const s = avs.value ? new Date(avs.value) : today; const eMin = new Date(s); eMin.setDate(s.getDate()+1); ave.min = eMin.toISOString().slice(0,10); if(ave.value){ const e = new Date(ave.value); if(e <= s) ave.value = eMin.toISOString().slice(0,10); } }catch(e){} } avs.addEventListener('change', syncDates); if(!avs.value || !ave.value){ const [s0,e0] = _defaultRange(); if(!avs.value) avs.value = _dateIso(s0); if(!ave.value) ave.value = _dateIso(e0); } syncDates(); } }catch(e){}
  })();
  </script>
</head>
<body>
  {% include 'spanel.html' %}
  <main style="max-width:1100px; margin:0 auto; padding:1.5rem clamp(1rem,4vw,3rem) 3rem;">
    <h1 style="margin:0 0 1.2rem; font-size:1.5rem; letter-spacing:-.5px; display:flex; align-items:center; gap:.65rem;">Manage Hotels</h1>
    <div id="status" class="status" aria-live="polite"></div>
    <div class="panel" style="padding:1.2rem 1.3rem 1.8rem;">
      <div style="display:flex; gap:.6rem; align-items:flex-end; flex-wrap:wrap; margin-bottom:.8rem;">
        <div class="field">
          <label for="av-start">From</label>
          <input type="date" id="av-start" />
        </div>
        <div class="field">
          <label for="av-end">To</label>
          <input type="date" id="av-end" />
        </div>
        <button id="btn-refresh" class="u-btn" type="button" style="height:36px;">Refresh</button>
      </div>
      <div id="loading" class="loading-overlay">
        <div class="spinner"><div></div><div></div><div></div><div></div></div>
        <div class="loading-text">Loading your managed hotels…</div>
      </div>
      <div id="empty" class="empty" hidden>No managed hotels yet. <a href="/create-hotel" style="color:var(--accent); text-decoration:none;">Create one →</a></div>
      <div id="managed-hotels" class="hotel-grid" hidden></div>
    </div>
  </main>
  <footer style="text-align:center; padding:2rem 0 3rem; font-size:.7rem; color:var(--text-dim);">© <span id="year"></span> Booking Platform • Manage Hotels</footer>
  <py-config>
    packages = []
  </py-config>
  <py-script src="{{ url_for('static', filename='py/manage_hotels.py') }}"></py-script>
</body>
</html>
