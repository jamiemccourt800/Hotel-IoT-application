version: '3.8'

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./main/static:/usr/share/nginx/html/static:ro
    depends_on:
      - hotels-frontend
      - users-frontend
      - bookings-frontend
      - hotels
      - users
      - bookings
  user-profile:
    build: ./backend/profile
    ports:
      - "5005:5000"