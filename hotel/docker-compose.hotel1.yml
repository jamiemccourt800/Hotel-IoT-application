name: hotel1
version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto
    ports:
      - "18831:1883"
    volumes:
      - ./mosquitto:/mosquitto/config:ro
    networks:
      - hotel1
      - iot-net

  #simulator:
  #  build: ./simulator
  #  environment:
  #    MQTT_BROKER: mosquitto
  #    MQTT_PORT: 1883
  #    HOTEL_ID: HTL-Alpha
  #    ROOM_NUMBER: 101
  #  ports:
  #    - "5001:5000"
  #  depends_on:
  #    - mosquitto
  #  networks:
  #    - hotel1

  temperature-sensor:
    build:
      context: ./room1
      dockerfile: temperature-sensor/Dockerfile
    environment:
      HOTEL_ID: hotel_01
      ROOM: 101
      SENSOR: temperature-sensor
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      TARGET_TEMP: 23.5
      INTERVAL: 1.0
      SPEED: 1.0
    volumes:
      - ./room1/temperature-sensor/.data:/app/.data:ro
    networks:
      - hotel1
      - iot-net

  temperature-actuator:
    build:
      context: ./room1
      dockerfile: temperature-actuator/Dockerfile
    environment:
      HOTEL_ID: hotel_01
      ROOM: 101
      SENSOR: temperature-actuator
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      DEFAULT_TARGET: 22.0
      CONTROL_INTERVAL: 5.0
      DEADBAND: 0.5
      # Unleash Feature Flags
      UNLEASH_URL: ${UNLEASH_URL:-}
      UNLEASH_CLIENT_KEY: ${UNLEASH_CLIENT_KEY:-}
      UNLEASH_APP_NAME: ${UNLEASH_APP_NAME:-room-simulator}
      UNLEASH_ENVIRONMENT: ${UNLEASH_ENVIRONMENT:-development}
    depends_on:
      - mosquitto
    networks:
      - hotel1
      - iot-net

  light-actuator:
    build:
      context: ./room1
      dockerfile: light-actuator/Dockerfile
    environment:
      HOTEL_ID: hotel_01
      ROOM: 101
      SENSOR: light-actuator
      BROKER: mosquitto
      BROKER_PORT: 1883
      QOS: 1
      KEEPALIVE: 60
      INITIAL_ON: "true"
      INITIAL_BRIGHTNESS: 100
      # Unleash Feature Flags
      UNLEASH_URL: ${UNLEASH_URL:-}
      UNLEASH_CLIENT_KEY: ${UNLEASH_CLIENT_KEY:-}
      UNLEASH_APP_NAME: ${UNLEASH_APP_NAME:-room-simulator}
      UNLEASH_ENVIRONMENT: ${UNLEASH_ENVIRONMENT:-development}
    depends_on:
      - mosquitto
    networks:
      - hotel1
      - iot-net

  light-sensor:
    build:
      context: ./room1
      dockerfile: light-sensor/Dockerfile
    environment:
      HOTEL_ID: hotel_01
      ROOM: 101
      SENSOR: light-sensor
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      INTERVAL: 1.0
      SPEED: 1.0
    depends_on:
      - mosquitto
    networks:
      - hotel1
      - iot-net

  humidity-sensor:
    build:
      context: ./room1
      dockerfile: humidity-sensor/Dockerfile
    environment:
      HOTEL_ID: hotel_01
      ROOM: 101
      SENSOR: humidity-sensor
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      TARGET_HUMIDITY: 50.0
      INTERVAL: 1.0
      SPEED: 1.0
    depends_on:
      - mosquitto
    networks:
      - hotel1
      - iot-net

  humidity-actuator:
    build:
      context: ./room1
      dockerfile: humidity-actuator/Dockerfile
    environment:
      HOTEL_ID: hotel_01
      ROOM: 101
      SENSOR: humidity-actuator
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      DEFAULT_TARGET: 50.0
      CONTROL_INTERVAL: 5.0
      DEADBAND: 2.0
      # Unleash Feature Flags
      UNLEASH_URL: ${UNLEASH_URL:-}
      UNLEASH_CLIENT_KEY: ${UNLEASH_CLIENT_KEY:-}
      UNLEASH_APP_NAME: ${UNLEASH_APP_NAME:-room-simulator}
      UNLEASH_ENVIRONMENT: ${UNLEASH_ENVIRONMENT:-development}
    depends_on:
      - mosquitto
    networks:
      - hotel1
      - iot-net

  alert-agent:
    build:
      context: ./room1
      dockerfile: alert-agent/Dockerfile
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_SUB: hotel_01/#
      MQTT_PUB: alerts
      HOTEL_ID: hotel_01
      ROOM: 101
      TEMP_HIGH_C: 30
      OFFLINE_TIMEOUT_S: 45
      DEDUP_WINDOW_S: 30
    depends_on:
      - mosquitto
    networks:
      - hotel1
      - iot-net

  mqtt-to-kafka:
    build: MQTT
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: hotel_01/#
      MQTT_PUB_TOPIC_PREFIX: sensors/#
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: mqtt_messages
      KAFKA_ACTIONS_TOPIC: executed_actions
      SITE_ID: hotel1
    depends_on:
      - mosquitto
    networks:
      - hotel1
      - iot-net

  kafka-to-mqtt:
    build: MQTT
    command: ["python", "kafka_to_mqtt.py"]
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_GROUP: hotel1-bridge
      KAFKA_PATTERN: actuators.*
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_QOS: 1
      MQTT_KEEPALIVE: 60
    depends_on:
      - mosquitto
    networks:
      - hotel1
      - iot-net

networks:
  iot-net:
    external: true
  hotel1:
    driver: bridge
