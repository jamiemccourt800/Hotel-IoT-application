[pytest]
# Python path - ensures imports work correctly
pythonpath = .

# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Console output options
addopts = 
    --tb=short
    --strict-markers
    -v
    --color=yes

# Custom markers for organizing tests
markers =
    integration: Integration tests requiring external services (Kafka, MQTT, VictoriaMetrics)
    e2e: End-to-end tests requiring full system deployment
    slow: Tests that take a long time to run
    skip_ci: Tests to skip in CI environment

# Coverage options (can be overridden by command-line args)
# These are default settings that can be extended in Makefile
[coverage:run]
source = .
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */.venv/*
    */node_modules/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
