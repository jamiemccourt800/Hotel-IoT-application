<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up • Booking Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.9.1/core.css" />
  <script type="module" src="https://pyscript.net/releases/2024.9.1/core.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <div class="orb"></div>
  <div class="orb orb2"></div>
  <div class="container">
    <div class="panel login-panel">
      <h1><span class="logo">Create</span> Account</h1>
      <p class="muted intro">Sign up to book hotels. You'll start as a guest.</p>
      <div id="status" class="status" aria-live="polite"></div>
  <form id="signup-form" action="/signup" method="post">
        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Zm0 2c-4.418 0-8 2.239-8 5v2h16v-2c0-2.761-3.582-5-8-5Z"/></svg>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Choose a username" required minlength="3" />
          </div>
        </div>
        <div class="field">
          <label for="display_name">Display Name (optional)</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Zm0 2c-4.418 0-8 2.239-8 5v2h16v-2c0-2.761-3.582-5-8-5Z"/></svg>
            <input id="display_name" name="display_name" type="text" placeholder="How others see you" />
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none"><path d="M17 9V7a5 5 0 1 0-10 0v2M6 9h12l1 12H5L6 9Zm6 4v4"/></svg>
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Minimum 6 characters" required minlength="6" />
          </div>
        </div>
        <button id="submit-btn" type="submit"><span class="btn-label">Create Account</span></button>
      </form>
      <div style="margin-top:1rem"></div>
      <a href="/login" style="font-size:.65rem; text-transform:uppercase; letter-spacing:.15em; font-weight:600; color:var(--text-dim); text-decoration:none;">Already have an account? Sign in</a>
    </div>
    <footer>© <span id="year"></span> Booking Platform • Sign Up</footer>
  </div>

  <py-config>
    packages = []
  </py-config>
  <py-script src="{{ url_for('static', filename='py/signup.py') }}"></py-script>
</body>
</html>
