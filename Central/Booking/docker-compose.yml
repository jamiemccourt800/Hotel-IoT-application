version: '3.8'

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./main/static:/usr/share/nginx/html/static:ro
    depends_on:
      - hotels-frontend
      - users-frontend
      - bookings-frontend
      - hotels
      - users
      - bookings
  hotels:
    build: ./backend/hotels
    ports:
      - "5001:5001"
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=root
      - MONGO_PASS=1Password!
      - MONGO_DB=bookings
    depends_on:
      - mongodb
  users:
    build: ./backend/users
    ports:
      - "5002:5002"
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=root
      - MONGO_PASS=1Password!
      - MONGO_DB=bookings
    depends_on:
      - mongodb
  bookings:
    build: ./backend/bookings
    ports:
      - "5003:5003"
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=root
      - MONGO_PASS=1Password!
      - MONGO_DB=bookings
    depends_on:
      - mongodb
  hotels-frontend:
    build: ./frontends/hotels-frontend
    ports:
      - "5100:5100"
    environment:
      - SECRET_KEY=devops_booking
      - HOTELS_API_URL=http://hotels:5001
      - USERS_API_URL=http://users:5002
      - BOOKINGS_API_URL=http://bookings:5003
    volumes:
      - ./frontends/hotels-frontend:/app
      - ./main/template:/app/templates_upstream:ro
      - ./main/static:/app/static_upstream:ro
    depends_on:
      - hotels
      - users
      - bookings
  users-frontend:
    build: ./frontends/users-frontend
    ports:
      - "5200:5200"
    environment:
      - SECRET_KEY=devops_booking
      - USERS_API_URL=http://users:5002
    volumes:
      - ./frontends/users-frontend:/app
      - ./main/template:/app/templates_upstream:ro
      - ./main/static:/app/static_upstream:ro
    depends_on:
      - users
  bookings-frontend:
    build: ./frontends/bookings-frontend
    ports:
      - "5300:5300"
    environment:
      - SECRET_KEY=devops_booking
      - BOOKINGS_API_URL=http://bookings:5003
    volumes:
      - ./frontends/bookings-frontend:/app
      - ./main/template:/app/templates_upstream:ro
      - ./main/static:/app/static_upstream:ro
    depends_on:
      - bookings
  
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./tempMongoDB:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 1Password!
      MONGO_INITDB_DATABASE: bookings


volumes:
  mongodb:
    external: true