<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Portal Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.5.1/core.css" />
  <script type="module" src="https://pyscript.net/releases/2024.5.1/core.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <div class="orb"></div>
  <div class="orb orb2"></div>
  <div class="container">
  <div class="panel login-panel">
      <h1><span class="logo">Booking</span> Portal</h1>
  <p class="muted intro">Sign in to access the central booking dashboard.</p>

      <div id="status" class="status" aria-live="polite"></div>

      <form id="login-form" py-onSubmit="handle_submit(event)">
        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Zm0 2c-4.418 0-8 2.239-8 5v2h16v-2c0-2.761-3.582-5-8-5Z"/></svg>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Your username" required minlength="3" />
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none"><path d="M17 9V7a5 5 0 1 0-10 0v2M6 9h12l1 12H5L6 9Zm6 4v4"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="6" />
          </div>
        </div>
        <button id="submit-btn" type="submit">
          <span class="btn-label">Sign In</span>
        </button>
      </form>

      <div style="margin-top: 1rem;"></div>

      <a href="/" style="font-size:.65rem; text-transform:uppercase; letter-spacing:.15em; font-weight:600; color:var(--text-dim); text-decoration:none;">Looking to book? Go to public site</a>
      <div style="margin-top:1rem" class="muted">Use <code>admin</code> / <code>password123</code> for demo access.</div>
    </div>
    <footer>© <span id="year"></span> Booking Platform • DevOps Group 3</footer>
  </div>

  <script type="py">
from js import document, fetch
import json, asyncio, datetime

API_LOGIN = '/api/login'

status_el = document.getElementById('status')
btn = document.getElementById('submit-btn')
label_span = btn.querySelector('.btn-label')

def set_status(message: str, kind: str):
    status_el.className = 'status show ' + kind
    status_el.innerHTML = message

def clear_status():
    status_el.className = 'status'
    status_el.innerHTML = ''


async def handle_submit(evt):
    evt.preventDefault()
    clear_status()
    form = document.getElementById('login-form')
    username = form.username.value.strip()
    password = form.password.value

    # basic client side validation
    if len(username) < 3:
        set_status('Username must be at least 3 characters', 'error')
        return
    if len(password) < 6:
        set_status('Password must be at least 6 characters', 'error')
        return

    # show loading state
    label_span.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span>'
    btn.disabled = True

    try:
        resp = await fetch(API_LOGIN, {
            'method': 'POST',
            'headers': { 'Content-Type': 'application/json' },
            'body': json.dumps({'username': username, 'password': password})
        })
        data = await resp.json()
        if data.to_py().get('ok'):
            user = data.to_py().get('user', {})
            set_status(f"Welcome, {user.get('display_name','User')}! Redirecting...", 'success')
            await asyncio.sleep(1.2)
            # Placeholder redirect - in a real app navigate to dashboard
            set_status('Demo complete. (Implement redirect to /dashboard)', 'success')
        else:
            set_status(data.to_py().get('error','Login failed'), 'error')
    except Exception as e:
        set_status('Network or server error: ' + str(e), 'error')
    finally:
        btn.disabled = False
        label_span.innerHTML = 'Sign In'

# Set year in footer
try:
    document.getElementById('year').innerHTML = str(datetime.datetime.now().year)
except Exception:
    pass
  </script>
</body>
</html>
