<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Hotel • Booking Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Removed PyScript; using lightweight vanilla JS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
 </head>
<body class="login-page">
    <div class="orb"></div>
    <div class="orb orb2"></div>
    <div class="container">
        <div class="panel login-panel">
            <h1><span class="logo">Booking</span> Portal</h1>
            <p class="muted intro">Create a new hotel listing.</p>
            <div id="status" class="status" aria-live="polite"></div>

    <form id="create-hotel-form">
        <label for="name">Hotel Name:</label>
        <input type="text" id="name" name="name" required>
        
        <label for="city">City:</label>
        <input type="text" id="city" name="city" required>
        
        <label for="country">Country:</label>
        <input type="text" id="country" name="country" required>
        
        <label for="price_per_night">Price per Night:</label>
        <input type="number" id="price_per_night" name="price_per_night" required>
        
        <label for="image">Image URL:</label>
        <input type="url" id="image" name="image" required>
        
                <button id="submit-btn" type="submit"><span class="btn-label">Create Hotel</span></button>
        </form>
        <div style="margin-top:1rem"></div>
        <a href="/" style="font-size:.65rem; text-transform:uppercase; letter-spacing:.15em; font-weight:600; color:var(--text-dim); text-decoration:none;">Back to listings</a>
        </div>
        <footer style="margin-top:1.8rem; text-align:center; font-size:.7rem; color:var(--text-dim);">© <span id="year"></span> Booking Platform • Create Hotel</footer>
    </div>

    <script>
    (function(){
        const API_CREATE = '/api/create-hotel';
        const form = document.getElementById('create-hotel-form');
        const statusEl = document.getElementById('status');
        const btn = document.getElementById('submit-btn');
        const labelSpan = btn.querySelector('.btn-label');
        console.debug('[create-hotel] script init');

        function setStatus(message, kind){
            statusEl.className = 'status show ' + kind;
            statusEl.textContent = message;
            console.debug('[create-hotel] status', kind, message);
        }
        function clearStatus(){
            statusEl.className = 'status';
            statusEl.textContent = '';
        }
        function serialize(){
            return {
                name: form.name.value.trim(),
                city: form.city.value.trim(),
                country: form.country.value.trim(),
                price_per_night: form.price_per_night.value.trim(),
                image: form.image.value.trim()
            };
        }
        async function submitHandler(e){
            e.preventDefault();
            console.debug('[create-hotel] submit intercepted');
            clearStatus();
            const payload = serialize();
            console.debug('[create-hotel] payload', payload);
            if(Object.values(payload).some(v => !v)){
                setStatus('All fields are required.', 'error');
                return;
            }
            btn.disabled = true;
            btn.classList.add('loading');
            labelSpan.textContent = 'Saving...';
            try {
                console.debug('[create-hotel] POST', API_CREATE);
                const resp = await fetch(API_CREATE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                console.debug('[create-hotel] response status', resp.status);
                let data = null;
                const text = await resp.text();
                console.debug('[create-hotel] raw response', text);
                try { data = JSON.parse(text); } catch(parseErr){
                    setStatus('Unexpected response format', 'error');
                    return;
                }
                if ((resp.ok && data.ok) || data.hotel_id){
                    setStatus(data.message || 'Hotel created! Redirecting...', 'success');
                    setTimeout(()=>{ window.location.href='/' }, 1100);
                } else {
                    setStatus(data.error || 'Failed to create hotel', 'error');
                }
            } catch(err){
                setStatus('Network or server error: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
                labelSpan.textContent = 'Create Hotel';
            }
        }
        if(form){
            form.addEventListener('submit', submitHandler);
            console.debug('[create-hotel] submit listener attached');
        } else {
            console.error('[create-hotel] form element not found');
        }
        // Autofill from query params (helps debugging when user bookmarked with params)
        try {
            const params = new URLSearchParams(window.location.search);
            ['name','city','country','price_per_night','image'].forEach(k => {
                if(params.has(k) && form[k]){
                    form[k].value = params.get(k);
                }
            });
        } catch(err){ console.debug('[create-hotel] autofill skipped', err); }
        // Footer year
        const yearEl = document.getElementById('year');
        if(yearEl) yearEl.textContent = String(new Date().getFullYear());
    })();
    </script>
</body>
</html>
