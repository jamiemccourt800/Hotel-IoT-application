version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"

    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - default

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server=kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  simulator:
    build: ./simulator
    depends_on:
      - mosquitto
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
    ports:
      - "5000:5000"

  iot-simulator:
    build: ./iot-simulator
    container_name: iot-simulator
    environment:
      HOTEL_ID: hotel_01
      ROOM: "101"
      SENSOR: sensor-iot
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      MQTT_QOS: "1"
      MQTT_RETAIN: "false"
      MQTT_KEEPALIVE: "60"
      SPEED: "1.0"
    restart: unless-stopped


  mqtt-to-kafka:
    build: ./MQTT
    depends_on:
      mosquitto:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      # Subscribe to both simulator`sensors/#` and the iot-simulator `telemetry/#` topics
      MQTT_TOPIC: "sensors/#,telemetry/#"
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: mqtt_messages

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - simulator
  
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.126.0
    command: --selfScrapeInterval=5s -storageDataPath=/victoria-metrics-data
    volumes:
      - ./victoria-metrics-data:/victoria-metrics-data
    ports:
      - "8428:8428"
    networks:
      - victoriametrics

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - kafka
      - victoria-metrics
    networks:
      - victoriametrics
      - default

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      # Default creds: admin / admin (you can override the password here)
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/data:/var/lib/grafana
    depends_on:
      - victoria-metrics
    networks:
      - victoriametrics

  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    ports:
      - "1880:1880"
    environment:
      TZ: Europe/Dublin
    volumes:
      - ./node-red-data:/data
    depends_on:
      - mosquitto
    networks:
      - default

networks:
  victoriametrics:
    driver: bridge

