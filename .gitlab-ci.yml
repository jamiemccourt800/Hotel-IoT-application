workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never

image: docker:27

services:
  - name: docker:27-dind
    command: ["--tls=false", "--mtu=1450"]

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: "" 
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

before_script:
  - apk add --no-cache git curl
  - chown -R "$USER":"$USER" . || true
  - docker version
  - docker info

stages:
  - build
  - test
  - push
  - deploy

build:
  stage: build
  script:
    - rm -rf central/frontend/node_modules || true
    - docker network create iot-net || true
    - docker compose -f hotel/docker-compose.hotel1.yml build
    - docker compose -f central/docker-compose.central.yml build
  after_script:
    - rm -rf central/victoria-metrics-data central/grafana/data || true

test:
  stage: test
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=false", "--mtu=1450"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    PYTHONPATH: "$CI_PROJECT_DIR"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    WAIT_INT_SECS: "25"   # tune if services are slow to boot
    WAIT_E2E_SECS: "40"
    AIOKAFKA_NO_EXTENSIONS: "1"
    TEST_MQTT_HOST: localHost
    TEST_MQTT_PORT:  1883
    TEST_KAFKA_BOOTSTRAP: localHost:9092
    TEST_VICTORIA_METRICS_URL: localHost:8428
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .cache/pip
      - .pytest_cache
  before_script:
    - apk add --no-cache python3 py3-pip git curl build-base python3-dev musl-dev linux-headers zlib-dev
    - python3 -m venv .venv
    - export PATH="$PWD/.venv/bin:$PATH"
    - python -m pip install --upgrade pip wheel
    - AIOKAFKA_NO_EXTENSIONS=1 pip install -r requirements-test.txt -r requirements.txt
    - AIOKAFKA_NO_EXTENSIONS=1 pip install "httpx>=0.25,<1.0" "aiokafka>=0.10,<1.0" pytest-asyncio coverage pytest-cov
    - mkdir -p reports
    - docker version && docker info
    
  script:
    - set -eu
    # -------- Unit + contract (fast, no services) --------
    - python -m pytest -vv tests/unit tests/contract
        --junitxml=reports/unit_contract.xml
        --cov=. --cov-report=term-missing --cov-append

    # -------- Integration (bring up test stack) ----------
    - docker ps -q | xargs -r docker rm -f || true
    - docker ps
    - docker compose -p test-int -f tests/docker-compose.test.central.yml up -d
    - sleep "$WAIT_INT_SECS"
    - docker ps
    - python -m pytest -vv tests/integration
        --junitxml=reports/integration.xml
        --cov=. --cov-report=term-missing --cov-append

    # -------- E2E (full stack) ---------------------------
    - docker compose -f tests/docker-compose.test.e2e.yml up -d
    - sleep "$WAIT_E2E_SECS"
    - docker ps
    - python -m pytest -vv tests/e2e
        --junitxml=reports/e2e.xml
        --cov=. --cov-report=term-missing --cov-append
        
  after_script:
    - mkdir -p reports || true
    - docker compose -f tests/docker-compose.test.e2e.yml logs -t > reports/e2e-docker.log || true
    - docker compose -f tests/docker-compose.test.e2e.yml down -v || true
    - '[ -x .venv/bin/python ] && .venv/bin/python -m coverage xml -o reports/coverage.xml || true'
    - '[ -x .venv/bin/python ] && .venv/bin/python -m coverage html -d reports/htmlcov || true'
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/
      - .coverage
      - .pytest_cache/
    reports:
      junit:
        - reports/unit_contract.xml
        - reports/integration.xml
        - reports/e2e.xml

push:
  stage: push
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker compose -f hotel/docker-compose.hotel1.yml build
    - docker compose -f central/docker-compose.central.yml build

    - docker tag hotel1-temperature-sensor:latest $DOCKERHUB_USERNAME/hotel-temperature-sensor:latest
    - docker tag hotel1-light-actuator:latest $DOCKERHUB_USERNAME/hotel-light-actuator:latest
    - docker tag hotel1-alert-agent:latest $DOCKERHUB_USERNAME/hotel-alert-agent:latest
    - docker tag hotel1-mqtt-to-kafka:latest $DOCKERHUB_USERNAME/hotel-mqtt-to-kafka:latest
    - docker tag hotel1-kafka-to-mqtt:latest $DOCKERHUB_USERNAME/hotel-kafka-to-mqtt:latest
    - docker push $DOCKERHUB_USERNAME/hotel-temperature-sensor:latest
    - docker push $DOCKERHUB_USERNAME/hotel-light-actuator:latest
    - docker push $DOCKERHUB_USERNAME/hotel-alert-agent:latest
    - docker push $DOCKERHUB_USERNAME/hotel-mqtt-to-kafka:latest
    - docker push $DOCKERHUB_USERNAME/hotel-kafka-to-mqtt:latest

    - docker tag central-hq-command:latest $DOCKERHUB_USERNAME/central-command:latest
    - docker tag central-hq-automation:latest $DOCKERHUB_USERNAME/central-automation:latest
    - docker tag central-hq-app-frontend:latest $DOCKERHUB_USERNAME/central-app-frontend:latest
    #- docker tag central-hq-app-backend:latest $DOCKERHUB_USERNAME/central-app-backend:latest
    - docker push $DOCKERHUB_USERNAME/central-command:latest
    - docker push $DOCKERHUB_USERNAME/central-automation:latest
    - docker push $DOCKERHUB_USERNAME/central-app-frontend:latest
    # - docker push $DOCKERHUB_USERNAME/central-app-backend:latest
  only:
    - main

deploy:
  stage: deploy
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

    # Pull latest images from Docker Hub
    - docker pull $DOCKERHUB_USERNAME/hotel-temperature-sensor:latest
    - docker pull $DOCKERHUB_USERNAME/hotel-light-actuator:latest
    - docker pull $DOCKERHUB_USERNAME/hotel-alert-agent:latest
    - docker pull $DOCKERHUB_USERNAME/hotel-mqtt-to-kafka:latest
    - docker pull $DOCKERHUB_USERNAME/hotel-kafka-to-mqtt:latest
    - docker pull $DOCKERHUB_USERNAME/central-command:latest
    - docker pull $DOCKERHUB_USERNAME/central-automation:latest
    - docker pull $DOCKERHUB_USERNAME/central-app-frontend:latest

    # Stop old containers
    - docker compose -f central/docker-compose.central.yml down || true
    - docker compose -f hotel/docker-compose.hotel1.yml down || true

    # Run with pulled images instead of building
    - docker compose -f central/docker-compose.central.dockerhub.yml up -d
    - docker compose -f hotel/docker-compose.hotel1.dockerhub.yml up -d
  only:
    - main
  when: on_success