stages:
  - build
  - run

build:
  stage: build
  image: docker:latest
  before_script:
  - apk add --no-cache docker-compose  # install docker-compose inside job runner
  script:
    - docker info
    - docker-compose -f central/docker-compose.central.yml build
    - docker-compose -f hotel/docker-compose.hotel1.yml build

run:
  stage: run
  image: docker:latest
  script:
    # Start containers in detached mode
    - docker-compose -f central/docker-compose.central.yml up -d
    - docker-compose -f hotel/docker-compose.hotel1.yml up -d
    # Wait a few seconds for services to boot
    - sleep 10
    # Run a test command (adjust as needed, e.g. curl healthcheck)
    - docker ps
    - docker-compose ps
  after_script:
    # Cleanup after job
    - docker-compose -f docker-compose.yml -f docker-compose.override.yml down