stages:
  # - build
  - run

before_script:
  - docker system prune -af --volumes
  - apk add --no-cache docker-compose  # install docker-compose inside job runner

# build:
#   stage: build
#   image: docker:latest
#   script:
#     - docker info
#     - docker-compose -f central/docker-compose.central.yml build
#     - docker-compose -f hotel/docker-compose.hotel1.yml build

run:
  stage: run
  image: docker:latest
  script:
    - docker network create iot-net || true
    - cd central && docker-compose -f docker-compose.central.yml up -d && cd ..
    - cd hotel && docker-compose -f docker-compose.hotel1.yml up -d && cd ..
    # Wait a few seconds for services to boot
    - sleep 10
    # Run a test command (adjust as needed, e.g. curl healthcheck)
    - docker ps
    - docker-compose ps