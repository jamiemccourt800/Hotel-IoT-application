name: hotel1
version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto
    ports:
      - "18831:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - hotel1
      - iot-net

  #simulator:
  #  build: ./simulator
  #  environment:
  #    MQTT_BROKER: mosquitto
  #    MQTT_PORT: 1883
  #    HOTEL_ID: HTL-Alpha
  #    ROOM_NUMBER: 101
  #  ports:
  #    - "5001:5000"
  #  depends_on:
  #    - mosquitto
  #  networks:
  #    - hotel1

  temperature-sensor:
    build:
     #context: ./hotel/101/temperature-sensor
      context: ./temperature-sensor
    environment:
      HOTEL_ID: hotel_01
      ROOM: "101"
      SENSOR: temperature-sensor
      BROKER: mosquitto
      BROKER_PORT: 1883
      MODE: random
      INTERVAL: 1.0
      SPEED: 1.0
    volumes:
     #- ./hotel/101/temperature-sensor/.data:/app/.data:ro
      - ./temperature-sensor/.data:/app/.data:ro
    networks:
      - hotel1
      - iot-net

  mqtt-to-kafka:
    build: ./MQTT
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: hotel_01/#
      MQTT_PUB_TOPIC_PREFIX: actuators/
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: mqtt_messages
      KAFKA_ACTIONS_TOPIC: executed_actions
      SITE_ID: hotel1
    depends_on:
      - mosquitto
    networks:
      - hotel1
      - iot-net

  node-red:
    image: nodered/node-red:latest
    container_name: node-red-hotel1
    ports:
      - "1881:1880"
    environment:
      TZ: Europe/Dublin
    volumes:
      - ./node-red-data:/data
    depends_on:
      - mosquitto
    networks:
      - hotel1
      - iot-net

  api:
    networks:
      - hotel1
    build:
      context: ./API-hotel
      no_cache: true
    container_name: api-hotel1
    ports:
      - "8000:8000"
    volumes:
      - ./API-hotel:/app
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - HOTEL_ID=HTL-Alpha
      - API_PORT=5000
    tty: true
    command: fastapi run

networks:
  iot-net:
    external: true
  hotel1:
    driver: bridge
